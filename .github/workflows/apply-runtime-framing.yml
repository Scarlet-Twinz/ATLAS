name: Apply runtime framing integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch runtime
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/proxy.rs')
          text = path.read_text()

          old_import = 'use crate::http::{parse_request, HttpRequest, ParseError, MAX_HEADER_BYTES};'
          new_import = 'use crate::http::{parse_request, parse_response_head, HttpRequest, ParseError, ResponseBodyMode, MAX_HEADER_BYTES};'
          if old_import in text:
              text = text.replace(old_import, new_import, 1)

          old_fn = '''async fn forward_once(
              state: &ProxyState,
              backend: SocketAddr,
              request_bytes: &[u8],
          ) -> Result<Vec<u8>, ProxyError> {
              let connect = timeout(state.config.connect_timeout, TcpStream::connect(backend)).await;
              let mut upstream = match connect {
                  Ok(Ok(stream)) => stream,
                  Ok(Err(_)) => return Err(ProxyError::UpstreamUnavailable),
                  Err(_) => return Err(ProxyError::UpstreamTimeout),
              };

              upstream.set_nodelay(true)?;
              upstream.write_all(request_bytes).await?;
              upstream.shutdown().await?;

              let read_result = timeout(state.config.request_timeout, async {
                  let mut response = Vec::new();
                  upstream.read_to_end(&mut response).await?;
                  Ok::<Vec<u8>, std::io::Error>(response)
              })
              .await;

              match read_result {
                  Ok(Ok(response)) if response.is_empty() => Err(ProxyError::UpstreamUnavailable),
                  Ok(Ok(response)) => Ok(response),
                  Ok(Err(error)) => Err(ProxyError::Io(error)),
                  Err(_) => Err(ProxyError::UpstreamTimeout),
              }
          }
          '''

          new_fn = '''async fn forward_once(
              state: &ProxyState,
              backend: SocketAddr,
              request_bytes: &[u8],
          ) -> Result<Vec<u8>, ProxyError> {
              let connect = timeout(state.config.connect_timeout, TcpStream::connect(backend)).await;
              let mut upstream = match connect {
                  Ok(Ok(stream)) => stream,
                  Ok(Err(_)) => return Err(ProxyError::UpstreamUnavailable),
                  Err(_) => return Err(ProxyError::UpstreamTimeout),
              };

              upstream.set_nodelay(true)?;
              upstream.write_all(request_bytes).await?;
              upstream.shutdown().await?;

              let read_result = timeout(state.config.request_timeout, read_response(&mut upstream)).await;

              match read_result {
                  Ok(Ok(response)) if response.is_empty() => Err(ProxyError::UpstreamUnavailable),
                  Ok(Ok(response)) => Ok(response),
                  Ok(Err(error)) => Err(error),
                  Err(_) => Err(ProxyError::UpstreamTimeout),
              }
          }

          async fn read_response(upstream: &mut TcpStream) -> Result<Vec<u8>, ProxyError> {
              let mut response = Vec::with_capacity(BUFFER_SIZE);
              let mut chunk = vec![0_u8; BUFFER_SIZE];

              let header_end = loop {
                  if let Some(end) = find_header_end(&response) {
                      break end;
                  }

                  let bytes_read = upstream.read(&mut chunk).await?;
                  if bytes_read == 0 {
                      return Err(ProxyError::UpstreamUnavailable);
                  }

                  response.extend_from_slice(&chunk[..bytes_read]);
                  if response.len() > MAX_HEADER_BYTES {
                      return Err(ProxyError::Http(ParseError::HeadersTooLarge));
                  }
              };

              let head = parse_response_head(&response[..header_end])?;

              match head.body {
                  ResponseBodyMode::None => {
                      response.truncate(header_end);
                  }
                  ResponseBodyMode::ContentLength(length) => {
                      let total = header_end
                          .checked_add(length)
                          .ok_or(ProxyError::RequestBodyTooLarge)?;

                      while response.len() < total {
                          let bytes_read = upstream.read(&mut chunk).await?;
                          if bytes_read == 0 {
                              return Err(ProxyError::UpstreamUnavailable);
                          }
                          response.extend_from_slice(&chunk[..bytes_read]);
                      }

                      response.truncate(total);
                  }
                  ResponseBodyMode::Chunked | ResponseBodyMode::UntilClose => {
                      upstream.read_to_end(&mut response).await?;
                  }
              }

              Ok(response)
          }
          '''

          if old_fn in text and 'async fn read_response(upstream: &mut TcpStream)' not in text:
              text = text.replace(old_fn, new_fn, 1)

          test_module = '''

#[cfg(test)]
mod response_runtime_tests {
    use super::*;
    use tokio::io::AsyncWriteExt;
    use tokio::net::TcpListener;

    #[tokio::test]
    async fn reads_content_length_response_without_waiting_for_close() {
        let listener = TcpListener::bind("127.0.0.1:0").await.unwrap();
        let address = listener.local_addr().unwrap();

        let server = tokio::spawn(async move {
            let (mut stream, _) = listener.accept().await.unwrap();
            stream
                .write_all(b"HTTP/1.1 200 OK\\r\\nContent-Length: 5\\r\\nConnection: keep-alive\\r\\n\\r\\nhello")
                .await
                .unwrap();
        });

        let mut client = TcpStream::connect(address).await.unwrap();
        let response = read_response(&mut client).await.unwrap();
        assert_eq!(response, b"HTTP/1.1 200 OK\\r\\nContent-Length: 5\\r\\nConnection: keep-alive\\r\\n\\r\\nhello");

        server.await.unwrap();
    }

    #[tokio::test]
    async fn reads_no_body_response_without_waiting_for_body_bytes() {
        let listener = TcpListener::bind("127.0.0.1:0").await.unwrap();
        let address = listener.local_addr().unwrap();

        let server = tokio::spawn(async move {
            let (mut stream, _) = listener.accept().await.unwrap();
            stream
                .write_all(b"HTTP/1.1 204 No Content\\r\\nConnection: keep-alive\\r\\n\\r\\n")
                .await
                .unwrap();
        });

        let mut client = TcpStream::connect(address).await.unwrap();
        let response = read_response(&mut client).await.unwrap();
        assert_eq!(response, b"HTTP/1.1 204 No Content\\r\\nConnection: keep-alive\\r\\n\\r\\n");

        server.await.unwrap();
    }
}
'''

          if 'mod response_runtime_tests' not in text:
              text += test_module

          path.write_text(text)

          Path('src/proxy_v2.tmp').unlink(missing_ok=True)
          Path('.github/workflows/apply-runtime-framing.yml').unlink()

      - name: Commit patched runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/proxy.rs src/proxy_v2.tmp .github/workflows/apply-runtime-framing.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Integrate response framing into proxy runtime'
          git push
